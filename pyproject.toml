[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rpa-studio"
version = "0.1.0"
description = "Local-first desktop RPA / workflow automation studio for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",       # use opencv-python-headless in CI / headless test environments
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyAutoGUI>=0.9.54",
    "pyperclip>=1.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
local-rpa-studio = "local_rpa_studio.main:main"
rpa-demo-app = "local_rpa_studio.demo_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
